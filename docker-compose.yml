# HealthTrackAI - Unified Docker Compose
# Single file for both development and production

services:
  # ============================================================
  # Frontend - Next.js
  # ============================================================
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        HF_KEY: ${HF_KEY}
    container_name: healthtrack-frontend
    ports:
      - "9002:9002"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=9002
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_dGVzdC1sb2NhbC1kZXYta2V5
      - CLERK_SECRET_KEY=test_secret_key_for_local_dev_only
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3000
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - HF_KEY=${HF_KEY}
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3000
      - BACKEND_URL=http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - healthtrack-net

  # ============================================================
  # Backend - NestJS
  # ============================================================
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: healthtrack-backend
    command: node dist/src/main
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://${DB_USER:-healthtrack}:${DB_PASSWORD:-healthtrack}@database:5432/${DB_NAME:-healthtrack}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-healthtrack}
      - DB_PASSWORD=${DB_PASSWORD:-healthtrack}
      - DB_NAME=${DB_NAME:-healthtrack}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - REDIS_URL=redis://cache:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - healthtrack-net

  # ============================================================
  # Database - PostgreSQL with pgvector
  # ============================================================
  database:
    image: pgvector/pgvector:pg16
    container_name: healthtrack-database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-healthtrack}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-healthtrack}
      - POSTGRES_DB=${DB_NAME:-healthtrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-healthtrack} -d ${DB_NAME:-healthtrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - healthtrack-net

  # ============================================================
  # Cache - Redis
  # ============================================================
  cache:
    image: redis:7-alpine
    container_name: healthtrack-cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - healthtrack-net

  # ============================================================
  # Workers - Background job processors
  # ============================================================
  workers:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    container_name: healthtrack-workers
    command: ["node", "dist/index.js"]
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://${DB_USER:-healthtrack}:${DB_PASSWORD:-healthtrack}@database:5432/${DB_NAME:-healthtrack}
      - HF_KEY=${HF_KEY}
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - healthtrack-net

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  healthtrack-net:
    driver: bridge
